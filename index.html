<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>漢字の読み</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/biz-udpgothic@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/biz-udpgothic@5/700.css">
<style>
:root{--ink:#222;--sub:#555;--line:#9a9a9a;--bg:#f6f5f1;--card:#fff;--accent:#1f5fa8;--ok:#1d7a3a;--ng:#b3261e}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"BIZ UDPGothic","BIZ UDゴシック","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg);font-size:20px;line-height:1.8;-webkit-text-size-adjust:100%}
rt{font-size:.5em;font-weight:400}
button{font:inherit;min-height:48px;min-width:48px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);padding:4px 16px;cursor:pointer;touch-action:manipulation;line-height:1.6}
button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
button.main{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;font-size:24px;padding:8px 28px}
button.sub{background:#fff}
button:disabled{opacity:.3;cursor:default}
.screen{display:none;max-width:880px;margin:0 auto;padding:12px 16px 40px}
.screen.show{display:block}
h1{font-size:34px;margin:6px 0 4px;text-align:center}
section{background:var(--card);border-radius:16px;padding:10px 16px 14px;margin:12px 0;border:1px solid #ddd}
section h2{font-size:20px;margin:0 0 6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{color:var(--sub);font-size:17px;margin:6px 0 0}
input[type=number]{font:inherit;width:120px;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:2px 10px}
input[type=number].on{border-color:var(--accent);border-width:3px}
.starts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.credit{font-size:13px;color:#777;text-align:center;margin-top:28px}
.credit a{color:#777}
/* quiz */
.bar{display:flex;justify-content:space-between;align-items:center}
.prog{font-size:22px;font-weight:700}
.word{font-family:"UD デジタル 教科書体 N-R","UD Digi Kyokasho N-R","BIZ UDPGothic","Hiragino Sans",sans-serif;font-size:clamp(56px,15vw,110px);text-align:center;margin:20px 0 16px;line-height:1.3;letter-spacing:.04em}
.ansrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#kb{font:inherit;font-size:34px;width:min(100%,460px);min-height:64px;border:3px solid var(--line);border-radius:14px;padding:4px 14px;text-align:center}
#kb:focus{outline:none;border-color:var(--accent)}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.slot{width:56px;height:64px;border:3px solid var(--line);border-radius:10px;background:#fff;font-size:36px;display:flex;align-items:center;justify-content:center}
.slot.fill{border-color:var(--accent)}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px auto 14px;max-width:640px}
.tile{width:64px;height:64px;font-size:34px;padding:0;border-radius:12px}
.fb{text-align:center;min-height:120px;margin-top:16px}
.fb .mark{font-size:60px;line-height:1.2;font-weight:700}
.fb.ok .mark{color:var(--ok)}
.fb.ng .mark{color:var(--ng)}
.fb .ansis{font-size:30px}
/* result */
.score{text-align:center;font-size:30px;font-weight:700;margin:16px 0}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.witem{background:#fff;border:1px solid #ccc;border-radius:10px;padding:6px 12px}
.witem b{font-size:26px;margin-right:10px}
/* print sheets */
.ptools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0 12px}
.sheets{overflow-x:auto}
.sheet{width:210mm;height:297mm;padding:10mm 14mm 9mm;background:#fff;margin:0 auto 16px;box-shadow:0 1px 6px rgba(0,0,0,.2);color:#000;display:flex;flex-direction:column;overflow:hidden}
.sh-head{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:1mm}
.sh-title{font-size:20pt;font-weight:700}
.sh-cond{font-size:11pt;font-weight:400;margin-left:4mm}
.sh-name{font-size:13pt;display:flex;align-items:flex-end;gap:2mm}
.sh-name .nbox{display:inline-block;width:62mm;border-bottom:1.5px solid #000;height:9mm}
.sh-inst{font-size:13pt;margin:2mm 0 2mm}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(var(--rows),1fr);column-gap:10mm;flex:1;min-height:0}
.cell{display:flex;flex-direction:column;justify-content:flex-start}
.cell .q{display:flex;align-items:baseline;gap:2mm;margin-bottom:1mm}
.cell .n{font-size:11pt;min-width:8mm}
.cell .w{font-family:"UD デジタル 教科書体 N-R","UD Digi Kyokasho N-R","BIZ UDPGothic","Hiragino Sans",sans-serif;font-size:24pt;line-height:1.25}
.cell .box{margin-left:0;height:15mm;border:1.5px solid #000;border-radius:1.5mm;font-size:18pt;display:flex;align-items:center;padding-left:4mm}
.sh-foot{display:flex;justify-content:space-between;font-size:8pt;color:#666;margin-top:2mm}
@page{size:A4 portrait;margin:0}
@media print{
  body{background:#fff}
  .noprint,.screen{display:none!important}
  #s-print.show{display:block!important;padding:0;margin:0;max-width:none}
  .sheets{overflow:visible}
  .sheet{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>

<!-- 設定 -->
<div class="screen show" id="s-setup">
  <h1><ruby>漢字<rt>かんじ</rt></ruby>の<ruby>読<rt>よ</rt></ruby>み</h1>

  <section>
    <h2><ruby>学年<rt>がくねん</rt></ruby>（いくつでも えらべます）</h2>
    <div class="row" id="grades"></div>
  </section>

  <section>
    <h2>ことば</h2>
    <div class="row">
      <button data-hard="0" class="on">ふつう</button>
      <button data-hard="1">むずかしい ことばも <ruby>入<rt>い</rt></ruby>れる</button>
    </div>
  </section>

  <section>
    <h2><ruby>問題<rt>もんだい</rt></ruby>の<ruby>数<rt>かず</rt></ruby></h2>
    <div class="row" id="cnts">
      <span id="cntsOr">または</span>
      <input type="number" id="cntIn" min="1" inputmode="numeric" placeholder="すうじ">
    </div>
    <p class="note" id="poolNote"></p>
  </section>

  <section>
    <h2>こたえかた（ここで こたえる ときだけ）</h2>
    <div class="row">
      <button data-inp="type" class="on"><ruby>字<rt>じ</rt></ruby>を <ruby>書<rt>か</rt></ruby>く</button>
      <button data-inp="tile"><ruby>文字<rt>もじ</rt></ruby>を えらぶ</button>
    </div>
  </section>

  <div class="starts">
    <button class="main" id="goQuiz">ここで こたえる</button>
    <button class="main" id="goPrint">プリントを つくる</button>
  </div>
  <p class="note" id="startNote" style="text-align:center"></p>

  <p class="credit">ことばと<ruby>読<rt>よ</rt></ruby>みのデータ：JMdict / KANJIDIC2（<a href="https://www.edrdg.org/edrdg/licence.html" target="_blank" rel="noopener">EDRDG</a>, CC BY-SA 4.0）を<ruby>加工<rt>かこう</rt></ruby></p>
</div>

<!-- クイズ -->
<div class="screen" id="s-quiz">
  <div class="bar">
    <span class="prog" id="prog"></span>
    <button class="sub" id="quit">やめる</button>
  </div>
  <div class="word" id="word"></div>

  <div id="typeArea">
    <div class="ansrow">
      <input id="kb" type="text" lang="ja" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="ひらがなで">
      <button class="main" id="sendKb">こたえる</button>
    </div>
  </div>

  <div id="tileArea">
    <div class="slots" id="slots"></div>
    <div class="tiles" id="tiles"></div>
    <div class="ansrow">
      <button class="sub" id="bs">1<ruby>字<rt>じ</rt></ruby> けす</button>
      <button class="sub" id="clr">ぜんぶ けす</button>
      <button class="main" id="sendTile">こたえる</button>
    </div>
  </div>

  <div class="fb" id="fb"></div>
</div>

<!-- 結果 -->
<div class="screen" id="s-result">
  <h1>おわり</h1>
  <div class="score" id="score"></div>
  <section id="wrongSec">
    <h2>まちがえた ことば</h2>
    <div class="wlist" id="wlist"></div>
  </section>
  <div class="starts">
    <button class="main" id="retryWrong">まちがえた <ruby>問題<rt>もんだい</rt></ruby>だけ もう<ruby>一回<rt>いっかい</rt></ruby></button>
    <button class="main" id="again">あたらしい <ruby>問題<rt>もんだい</rt></ruby>で もう<ruby>一回<rt>いっかい</rt></ruby></button>
    <button class="sub" id="toSetup1">はじめに もどる</button>
  </div>
</div>

<!-- プリント -->
<div class="screen" id="s-print">
  <div class="ptools noprint">
    <button class="main" id="doPrint"><ruby>印刷<rt>いんさつ</rt></ruby>する</button>
    <button class="sub" id="regen">べつの <ruby>問題<rt>もんだい</rt></ruby>で つくりなおす</button>
    <button class="sub" id="toSetup2">もどる</button>
  </div>
  <p class="note noprint" style="text-align:center" id="printNote"></p>
  <div class="sheets" id="sheets"></div>
</div>

const norm = s => (s||'').normalize('NFKC').replace(/[\s　]/g,'')
  .replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const isRight = (item,ans) => [item.r,...item.a].includes(norm(ans));

const PAIRS = ['かが','きぎ','くぐ','けげ','こご','さざ','しじ','すず','せぜ','そぞ','ただ','ちぢ','つづ','てで','とど','はばぱ','ひびぴ','ふぶぷ','へべぺ','ほぼぽ','あぁ','いぃ','うぅ','えぇ','おぉ','やゃ','ゆゅ','よょ','つっ','わゎ'];
function variants(c){ const out=new Set(); PAIRS.forEach(p=>{ if(p.includes(c)) [...p].forEach(x=>x!==c&&out.add(x)); }); return [...out]; }
const COMMON = [...'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわんがぎぐげござじずぜぞだでどばびぶべぼぱぴぷぺぽゃゅょっ'];
function makeTiles(r){
  const chars=[...r], have=new Set(chars);
  const n=Math.min(6,Math.max(3,Math.ceil(chars.length*0.6)));
  const near=shuffle(chars.flatMap(variants).filter(c=>!have.has(c)));
  const d=[];
  for(const c of near){ if(d.length>=Math.ceil(n/2)) break; if(!d.includes(c)) d.push(c); }
  const rest=shuffle(COMMON.filter(c=>!have.has(c)&&!d.includes(c)));
  while(d.length<n) d.push(rest.pop());
  return shuffle([...chars,...d]).map((c,i)=>({c,id:i,used:false}));
}

function startQuiz(items){
  Q.items=items; Q.i=0; Q.wrong=[];
  $('typeArea').style.display = S.input==='type'?'':'none';
  $('tileArea').style.display = S.input==='tile'?'':'none';
  show('s-quiz'); showQ();
}
function showQ(){
  const it=Q.items[Q.i]; Q.answered=false;
  $('prog').textContent=`${Q.i+1} / ${Q.items.length}`;
  $('word').textContent=it.w;
  $('fb').className='fb'; $('fb').innerHTML='';
  if(S.input==='type'){
    $('kb').value=''; $('kb').disabled=false; $('sendKb').disabled=false;
    setTimeout(()=>$('kb').focus(),30);
  } else {
    Q.tiles=makeTiles(it.r); Q.picked=[]; renderTiles();
  }
}
function renderTiles(){
  const it=Q.items[Q.i], len=[...it.r].length;
  let s=''; for(let k=0;k<len;k++){ const t=Q.picked[k]; s+=`<div class="slot${t?' fill':''}">${t?esc(t.c):''}</div>`; }
  $('slots').innerHTML=s;
  $('tiles').innerHTML=Q.tiles.map(t=>`<button class="tile" data-t="${t.id}" ${t.used||Q.answered||Q.picked.length>=len?'disabled':''}>${esc(t.c)}</button>`).join('');
  $('bs').disabled=$('clr').disabled=Q.answered||!Q.picked.length;
  $('sendTile').disabled=Q.answered||Q.picked.length!==len;
}
$('tiles').addEventListener('click',e=>{
  const b=e.target.closest('.tile'); if(!b||b.disabled) return;
  const t=Q.tiles.find(x=>x.id===+b.dataset.t); t.used=true; Q.picked.push(t); renderTiles();
});
$('bs').onclick=()=>{ const t=Q.picked.pop(); if(t) t.used=false; renderTiles(); };
$('clr').onclick=()=>{ Q.picked.forEach(t=>t.used=false); Q.picked=[]; renderTiles(); };

function judge(ans){
  if(Q.answered) return;
  const it=Q.items[Q.i];
  if(S.input==='type' && !norm(ans)) { $('kb').focus(); return; }
  Q.answered=true;
  const ok=isRight(it,ans);
  if(!ok) Q.wrong.push(it);
  const last=Q.i===Q.items.length-1;
  $('fb').className='fb '+(ok?'ok':'ng');
  $('fb').innerHTML = (ok
    ? `<div class="mark">○ せいかい！</div>`
    : `<div class="mark">× ざんねん</div><div class="ansis">こたえは「<b>${esc(it.r)}</b>」</div>`)
    + `<div style="margin-top:10px"><button class="main" id="next">${last?'けっかを みる':'つぎへ'}</button></div>`;
  if(S.input==='type'){ $('kb').disabled=true; $('sendKb').disabled=true; } else renderTiles();
  $('next').onclick=next; setTimeout(()=>{const n=$('next'); if(n) n.focus();},30);
}
function next(){ if(Q.i<Q.items.length-1){ Q.i++; showQ(); } else showResult(); }
$('sendKb').onclick=()=>judge($('kb').value);
$('kb').addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.isComposing && e.keyCode!==229){ e.preventDefault(); judge($('kb').value); } });
$('sendTile').onclick=()=>judge(Q.picked.map(t=>t.c).join(''));
$('quit').onclick=()=>show('s-setup');

function showResult(){
  const n=Q.items.length, ok=n-Q.wrong.length;
  $('score').innerHTML=`${n}${rb('問','もん')}${rb('中','ちゅう')} ${ok}${rb('問','もん')} せいかい`+(ok===n?'<br>ぜんぶ せいかい！':'');
  $('wrongSec').style.display=Q.wrong.length?'':'none';
  $('retryWrong').style.display=Q.wrong.length?'':'none';
  $('wlist').innerHTML=Q.wrong.map(x=>`<div class="witem"><b>${esc(x.w)}</b>${esc(x.r)}</div>`).join('');
  show('s-result');
}
$('retryWrong').onclick=()=>startQuiz(shuffle(Q.wrong.slice()));
$('again').onclick=()=>startQuiz(pick());
$('toSetup1').onclick=()=>show('s-setup');

$('goQuiz').onclick=()=>{ const it=pick(); $('startNote').innerHTML=countNote(it.length); startQuiz(it); };

/* ---------- プリント ---------- */
function condLabel(){
  const gs=[...S.grades].sort((a,b)=>a-b).map(g=>g===7?rb('中学','ちゅうがく'):g+'年').join('・');
  return gs+(S.hard?'（むずかしい ことば あり）':'');
}
function sheetHTML(items,start,page,pages,answer){
  const cells=items.map((x,k)=>`<div class="cell"><div class="q"><span class="n">(${start+k+1})</span><span class="w">${esc(x.w)}</span></div><div class="box">${answer?esc(x.r):''}</div></div>`).join('');
  const title = answer ? 'こたえ' : `${rb('漢字','かんじ')}の${rb('読','よ')}み`;
  return `<div class="sheet">
    <div class="sh-head"><div class="sh-title">${title}<span class="sh-cond">${condLabel()}</span></div>
      ${answer?'':`<div class="sh-name">${rb('名前','なまえ')}<span class="nbox"></span></div>`}</div>
    <p class="sh-inst">${answer?'':`つぎの ${rb('漢字','かんじ')}の ${rb('読','よ')}みを ひらがなで ${rb('書','か')}きましょう。`}</p>
    <div class="grid" style="--rows:${PER_PAGE/2}">${cells}</div>
    <div class="sh-foot"><span>${answer?'こたえ ':''}${page} / ${pages}</span><span>データ：JMdict / KANJIDIC2（EDRDG, CC BY-SA 4.0）</span></div>
  </div>`;
}
function renderPrint(items){
  lastPrint=items;
  const pages=Math.ceil(items.length/PER_PAGE); let h='';
  for(const ans of [false,true])
    for(let p=0;p<pages;p++) h+=sheetHTML(items.slice(p*PER_PAGE,(p+1)*PER_PAGE),p*PER_PAGE,p+1,pages,ans);
  $('sheets').innerHTML=h;
  $('printNote').innerHTML=countNote(items.length)+` ${rb('問題','もんだい')} ${pages}まい ＋ こたえ ${pages}まい`;
}
$('goPrint').onclick=()=>{ renderPrint(pick()); show('s-print'); };
$('regen').onclick=()=>renderPrint(pick());
$('doPrint').onclick=()=>window.print();
$('toSetup2').onclick=()=>show('s-setup');

/* ---------- 起動 ---------- */
renderGrades(); updateNotes();
window.__G = {S,Q,WORDS,pool,pick,norm,isRight,makeTiles,startQuiz,renderPrint,get lastPrint(){return lastPrint;}};
</script>
